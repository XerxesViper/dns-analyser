# Self-hosted deployment (Hetzner VPS behind Apache reverse proxy).
#   cd /opt/dns-analyser && git pull && docker compose up -d --build
services:
  dns-analyser:
    build: .
    image: dns-analyser:latest
    container_name: dns-analyser
    restart: unless-stopped
    ports:
      # localhost only - Apache terminates TLS and proxies (incl. websocket) to this port
      - "127.0.0.1:9000:8080"
    read_only: true
    tmpfs:
      # writable scratch space for the non-root user (uid 10001) on a read-only rootfs
      - /tmp:mode=1777
      - /home/app:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
